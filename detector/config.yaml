detector:
  backend: dummy        # dummy | baseline | model  (dummy: 항상 has_pill=True, 연동 테스트용)

camera:
  mode: webcam          # webcam | picamera2 | file
  device_index: 0       # webcam 모드에서 cv2.VideoCapture 번호
  file_dir: samples/filled   # file 모드에서 읽을 샘플 폴더

preprocess:
  size: [128, 128]      # 리사이즈 (width, height)

# 칸별 ROI: [x, y, w, h] 픽셀. 아래는 임시값, 실제 카메라 고정 후 수정.
# 칸 수만큼 항목 추가.
compartments:
  1:
    roi: [0, 0, 100, 100]
  2:
    roi: [100, 0, 100, 100]

baseline:
  threshold: 0.5        # 기준 대비 차이 점수가 이 값보다 크면 알약 있음 (임시값, 사진 수집 후 조정)

model:
  path: null            # 모델 파일 경로 (추후)
