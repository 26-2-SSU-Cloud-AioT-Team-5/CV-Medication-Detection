model:
  path: models/phase2_best.onnx   # git에 안 올림. Pi에는 scp로 복사
  input_size: [224, 224]  # (width, height). 학습 입력 크기

# 뚜껑 열림/닫힘 판단과 개수 확정 (detector/watcher.py). 실제 사진으로 조정할 값
watcher:
  dark_level: 100        # 크롭 픽셀 밝기(0~255)가 이보다 낮으면 바닥판으로 봄
  open_dark_ratio: 0.5   # 바닥판 픽셀 비율이 이 이상이면 열림 (2026-11-23 사진: 열림 0.69~0.96, 닫힘 0.00~0.02)
  switch_frames: 2       # 열림/닫힘이 이만큼 연속으로 나와야 상태를 바꿈
  stable_frames: 2       # 같은 개수가 이만큼 연속이어야 확정 (1초 간격이면 뚜껑을 약 4초 이상 열어야 ok)
  min_confidence: 0.8    # 확정에 쓰는 사진의 최소 confidence

# 칸별 크롭 영역 [x, y, w, h] (통 전체 사진의 픽셀 좌표, 학습 때 잘라낸 영역과 같아야 함)
# 카메라가 움직이면 새 사진으로 다시 잡는다: python -m detector.calibrate 사진.jpg (확인만: --show)
# 지금 값: open_pills.jpg(4608x2592, 2026-11-23)의 칸 바닥(검은 판) 영역에서 4% 안쪽
rois:
  1: [1370, 1223, 483, 696]
  2: [1853, 1270, 608, 712]
  3: [2715, 1308, 585, 735]
  4: [3378, 1338, 479, 769]
